name: Maven integration tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: bank_assignment_tests
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=20s
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run committed integration tests and package the application
        run: mvn --batch-mode --no-transfer-progress verify
