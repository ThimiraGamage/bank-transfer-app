<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deposit Money</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h1>Deposit Money</h1>
    <p>Bank Transfer System &middot; Spring Boot &middot; MySQL</p>
</header>

<main class="container">

    <nav class="card navigation">
        <a th:href="@{/}" class="btn small">Dashboard</a>
        <a th:href="@{/withdraw}" class="btn small">Withdraw Money</a>
        <a th:href="@{/large-transfers(min=10000)}" class="btn small">
            Large Transfers
        </a>
    </nav>

    <div class="alert success"
         th:if="${success}"
         th:text="${success}"></div>

    <div class="alert danger"
         th:if="${error}"
         th:text="${error}"></div>

    <section class="card">
        <h2>Deposit Funds</h2>

        <form th:action="@{/deposit}" th:object="${moneyRequest}" method="post" novalidate>
            <div class="field">
                <label for="accountNumber">Customer Account</label>
                <select id="accountNumber" th:field="*{accountNumber}" required>
                    <option value="">-- Select account --</option>
                    <option th:each="c : ${customers}"
                            th:value="${c.accountNumber}"
                            th:text="${c.fullName + ' (' + c.accountNumber + ')'}">
                    </option>
                </select>
                <small class="error" th:if="${#fields.hasErrors('accountNumber')}" th:errors="*{accountNumber}"></small>
            </div>

            <div class="field">
                <label for="amount">Amount (LKR)</label>
                <input type="number"
                       id="amount"
                       th:field="*{amount}"
                       min="0.01"
                       step="0.01"
                       placeholder="5000.00"
                       required>
                <small class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></small>
            </div>

            <button type="submit" class="btn primary">
                Deposit Money
            </button>
        </form>
    </section>

</main>

<footer class="footer">
    BECS 32263 &middot; Assignment 01
</footer>

</body>
</html>
